<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB TRUCK SIMULATOR</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  color: white;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 65% 55%, #424b55 0%, #20262e 38%, #090d12 85%);
  overflow-x: hidden;
}

header {
  padding: 25px 35px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #ffffff22;
  background: #080c12aa;
}

.logo {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: #168cff;
}

.profile {
  color: #bbb;
  font-size: 13px;
}

main {
  display: flex;
  min-height: calc(100vh - 85px);
}

.menu {
  width: 270px;
  padding: 35px 20px;
  background: #080c12d9;
  border-right: 1px solid #ffffff18;
}

.menu h2 {
  font-size: 13px;
  color: #168cff;
  margin: 0 0 22px 12px;
  letter-spacing: 3px;
}

.menu button {
  display: block;
  width: 100%;
  padding: 17px;
  margin-bottom: 9px;
  text-align: left;
  color: #ddd;
  background: transparent;
  border: 1px solid transparent;
  font-size: 15px;
  cursor: pointer;
}

.menu button:hover,
.menu button.active {
  background: #168cff22;
  border-left: 4px solid #168cff;
  color: white;
}

.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 45px;
  min-width: 0;
}

.tag {
  color: #168cff;
  letter-spacing: 5px;
  font-size: 13px;
  font-weight: bold;
}

h1 {
  font-size: clamp(30px, 5vw, 58px);
  margin-top: 12px;
  text-shadow: 0 4px 15px #000;
}

.subtitle {
  color: #bbb;
  margin-top: 12px;
}

.truck-area {
  position: relative;
  min-height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.truck {
  position: relative;
  width: min(570px, 90%);
  height: 190px;
  filter: drop-shadow(0 20px 15px #0009);
}

.trailer {
  position: absolute;
  left: 0;
  top: 30px;
  width: 58%;
  height: 105px;
  background: linear-gradient(#d9dce0, #777f88);
  border: 4px solid #343b43;
  border-radius: 5px;
  box-shadow: inset 0 0 0 5px #ffffff22;
}

.trailer::after {
  content: "AB CARGAS";
  position: absolute;
  top: 35px;
  width: 100%;
  text-align: center;
  color: #263746;
  font-weight: 900;
  font-size: 22px;
  letter-spacing: 3px;
}

.cab {
  position: absolute;
  right: 5%;
  top: 48px;
  width: 33%;
  height: 105px;
  background: linear-gradient(110deg, #b90000, #ed1717, #780000);
  border: 3px solid #510000;
  border-radius: 20px 30px 7px 7px;
}

.cab::before {
  content: "";
  position: absolute;
  right: 12px;
  top: 12px;
  width: 65%;
  height: 38px;
  background: linear-gradient(135deg, #172b3b, #08121c);
  border: 3px solid #3d4146;
  border-radius: 8px 18px 3px 3px;
}

.cab::after {
  content: "SCANIA";
  position: absolute;
  bottom: 10px;
  right: 18px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}

.wheel {
  position: absolute;
  bottom: 0;
  width: 49px;
  height: 49px;
  background: radial-gradient(circle, #777 0 18%, #222 20% 42%, #080808 45%);
  border: 5px solid #111;
  border-radius: 50%;
}

.w1 { left: 12%; }
.w2 { left: 49%; }
.w3 { right: 10%; }

.floor {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 2px;
  background: #168cff88;
  box-shadow: 0 0 25px #168cff;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.start {
  padding: 18px 45px;
  background: #087be8;
  color: white;
  border: none;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.start:hover {
  background: #2798ff;
}

.version {
  color: #777;
  font-size: 12px;
  margin-top: 25px;
}

@media(max-width:700px) {
  main { flex-direction: column; }
  .menu { width: 100%; padding: 15px; }
  .menu button { display: inline-block; width: auto; padding: 10px; }
  .content { padding: 25px 15px; }
  .truck { transform: scale(.85); }
}
</style>
</head>

<body>

<header>
  <div class="logo"><span>AB</span> TRUCK SIMULATOR</div>
  <div class="profile">PERFIL: MOTORISTA</div>
</header>

<main>
  <nav class="menu">
    <h2>MENU PRINCIPAL</h2>
    <button class="active" onclick="selecionar(this)">🚛 Dirigir</button>
    <button onclick="selecionar(this)">🔧 Garagem</button>
    <button onclick="selecionar(this)">🏢 Concessionária</button>
    <button onclick="selecionar(this)">📦 Mercado de trabalho</button>
    <button onclick="selecionar(this)">⚙️ Configurações</button>
    <button onclick="selecionar(this)">🚪 Sair</button>
  </nav>

  <section class="content">
    <div>
      <div class="tag">AB GAMES APRESENTA</div>
      <h1>AB TRUCK SIMULATOR</h1>
      <p class="subtitle">Sua estrada. Seu caminhão. Sua história.</p>
    </div>

    <div class="truck-area">
      <div class="truck">
        <div class="trailer"></div>
        <div class="cab"></div>
        <div class="wheel w1"></div>
        <div class="wheel w2"></div>
        <div class="wheel w3"></div>
      </div>
      <div class="floor"></div>
    </div>

    <div>
      <div class="actions">
        <button class="start" onclick="alert('Em breve: vamos começar a dirigir!')">
          ▶ INICIAR JOGO
        </button>
      </div>
      <div class="version">AB TRUCK SIMULATOR • VERSÃO 0.1</div>
    </div>
  </section>
</main>

<script>
function selecionar(botao) {
  document.querySelectorAll(".menu button").forEach(b => {
    b.classList.remove("active");
  });
  botao.classList.add("active");
}
</script>

</body>
</html>
