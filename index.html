<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB TRUCK SIMULATOR</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080d15;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  background: #080c12;
  border-bottom: 1px solid #168cff;
  font-size: 24px;
  font-weight: bold;
}

header span { color: #168cff; }

main {
  display: flex;
  min-height: calc(100vh - 70px);
}

nav {
  width: 230px;
  padding: 25px 15px;
  background: #101722;
}

nav h3 {
  color: #168cff;
  font-size: 13px;
  letter-spacing: 2px;
}

nav button {
  display: block;
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  background: transparent;
  border: 1px solid #293747;
  color: white;
  text-align: left;
  cursor: pointer;
}

nav button:hover,
nav button.active {
  background: #12345a;
  border-color: #168cff;
}

section {
  flex: 1;
  min-width: 0;
  padding: 25px;
}

h1 { font-size: 30px; }

#garagem {
  width: 100%;
  height: 65vh;
  min-height: 350px;
  background: radial-gradient(#35414f, #101722 70%);
  border: 1px solid #34465b;
  border-radius: 8px;
  overflow: hidden;
}

.info {
  color: #aab8c8;
  margin-top: 15px;
}

@media(max-width:650px) {
  main { flex-direction: column; }
  nav { width: 100%; }
  nav button { display: inline-block; width: auto; }
  section { padding: 15px; }
}
</style>
</head>

<body>

<header><span>AB</span> TRUCK SIMULATOR</header>

<main>
<nav>
<h3>MENU PRINCIPAL</h3>
<button class="active">🚛 Garagem</button>
<button>🛣️ Dirigir</button>
<button>🏢 Concessionária</button>
<button>📦 Mercado de trabalho</button>
<button>⚙️ Configurações</button>
</nav>

<section>
<h1>MINHA GARAGEM</h1>
<div id="garagem"></div>
<p class="info">Garagem 3D • Modelos de caminhões em desenvolvimento</p>
</section>
</main>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const area = document.getElementById('garagem');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202a36);

const camera = new THREE.PerspectiveCamera(
  45,
  area.clientWidth / area.clientHeight,
  0.1,
  100
);

camera.position.set(7, 5, 9);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(area.clientWidth, area.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
area.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 2));

const luz = new THREE.DirectionalLight(0xffffff, 3);
luz.position.set(5, 10, 5);
scene.add(luz);

const piso = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({color:0x343a40})
);
piso.rotation.x = -Math.PI / 2;
piso.position.y = -0.1;
scene.add(piso);

// Base provisória para testar a garagem 3D
const plataforma = new THREE.Mesh(
  new THREE.BoxGeometry(5, 0.2, 3),
  new THREE.MeshStandardMaterial({color:0x168cff})
);
plataforma.position.y = 0;
scene.add(plataforma);

function animar() {
  requestAnimationFrame(animar);
  plataforma.rotation.y += 0.005;
  renderer.render(scene, camera);
}

animar();

window.addEventListener('resize', () => {
  camera.aspect = area.clientWidth / area.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(area.clientWidth, area.clientHeight);
});
</script>

</body>
</html>
