
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB TRUCK SIMULATOR</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080d15;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 20px;
  background: #080c12;
  border-bottom: 1px solid #168cff;
  font-size: 24px;
  font-weight: bold;
}
header span { color: #168cff; }
main { display: flex; min-height: calc(100vh - 68px); }
nav {
  width: 220px;
  padding: 22px 14px;
  background: #101722;
}
nav h3 { color: #168cff; font-size: 13px; }
nav button {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  color: white;
  background: transparent;
  border: 1px solid #293747;
  text-align: left;
}
nav button.active {
  background: #12345a;
  border-color: #168cff;
}
section { flex: 1; min-width: 0; padding: 20px; }
h1 { font-size: 28px; }
#garagem {
  width: 100%;
  height: 75vh;
  min-height: 400px;
  background: #182431;
  border: 1px solid #34465b;
  border-radius: 8px;
  overflow: hidden;
}
.info { color: #aab8c8; }
@media(max-width:650px) {
  main { flex-direction: column; }
  nav { width: 100%; }
  nav button { display: inline-block; width: auto; }
  #garagem { height: 60vh; }
}
</style>
</head>
<body>

<header><span>AB</span> TRUCK SIMULATOR</header>

<main>
<nav>
<h3>MENU PRINCIPAL</h3>
<button class="active">🚛 Garagem</button>
<button>🛣️ Dirigir</button>
<button>🏢 Concessionária</button>
<button>📦 Mercado de trabalho</button>
<button>⚙️ Configurações</button>
</nav>

<section>
<h1>MINHA GARAGEM</h1>
<div id="garagem"></div>
<p class="info">Garagem 3D • Scania 113 vermelha</p>
</section>
</main>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const area = document.getElementById('garagem');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202a36);

const camera = new THREE.PerspectiveCamera(
  42, area.clientWidth / area.clientHeight, 0.1, 200
);
camera.position.set(11, 8, 13);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(area.clientWidth, area.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
area.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 2));

const luz = new THREE.DirectionalLight(0xffffff, 3);
luz.position.set(8, 14, 8);
luz.castShadow = true;
scene.add(luz);

const piso = new THREE.Mesh(
  new THREE.PlaneGeometry(22, 18),
  new THREE.MeshStandardMaterial({color:0x343b44, roughness:0.8})
);
piso.rotation.x = -Math.PI / 2;
piso.position.y = -0.12;
piso.receiveShadow = true;
scene.add(piso);

// Plataforma grande
const plataforma = new THREE.Mesh(
  new THREE.BoxGeometry(19, 0.25, 15),
  new THREE.MeshStandardMaterial({color:0x263747, metalness:0.3})
);
plataforma.position.y = 0;
plataforma.receiveShadow = true;
scene.add(plataforma);

// Grupo do caminhão
const truck = new THREE.Group();
scene.add(truck);

function caixa(parent, w, h, d, x, y, z, color, metal=0.15) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color, metalness:metal, roughness:0.45})
  );
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// Chassi
caixa(truck, 8.5, 0.35, 1.35, 0, 0.75, 0, 0x171b20);

// Carreta
caixa(truck, 5.4, 2.5, 2.35, -1.7, 2.25, 0, 0xc7cbd0, 0.35);
caixa(truck, 5.5, 0.12, 2.4, -1.7, 3.55, 0, 0x777f88);

// Cabine vermelha bicuda
caixa(truck, 2.35, 1.85, 2.15, 2.65, 1.9, 0, 0xc40012);
caixa(truck, 1.25, 0.9, 2.2, 4.0, 1.45, 0xd71920);
caixa(truck, 1.15, 0.65, 1.85, 2.9, 2.9, 0xb90010);

// Para-brisa
caixa(truck, 0.08, 0.85, 1.75, 3.25, 2.55, 0, 0x172e40, 0.5);

// Janelas laterais
caixa(truck, 1.15, 0.7, 0.06, 2.55, 2.55, 1.09, 0x172e40, 0.5);
caixa(truck, 1.15, 0.7, 0.06, 2.55, 2.55, -1.09, 0x172e40, 0.5);

// Grade frontal
caixa(truck, 0.08, 0.8, 1.0, 4.59, 1.25, 0, 0x171b20);
for(let i=0;i<5;i++){
  caixa(truck,0.04,0.035,0.85,4.64,0.95+i*0.14,0,0x89939d);
}

// Faróis
caixa(truck,0.12,0.25,0.35,4.65,1.0,0.78,0xffffff);
caixa(truck,0.12,0.25,0.35,4.65,1.0,-0.78,0xffffff);

// Para-choque
caixa(truck,0.3,0.25,2.1,4.65,0.65,0,0x252a30);

// Rodas
function roda(x,z) {
  const wheel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.57,0.57,0.34,32),
    new THREE.MeshStandardMaterial({color:0x101010, roughness:0.9})
  );
  wheel.rotation.z = Math.PI/2;
  wheel.position.set(x,0.62,z);
  wheel.castShadow = true;
  truck.add(wheel);

  const hub = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25,0.25,0.36,24),
    new THREE.MeshStandardMaterial({color:0x9da5ad, metalness:0.8})
  );
  hub.rotation.z = Math.PI/2;
  hub.position.set(x,0.62,z);
  truck.add(hub);
}

[-1.0,1.0].forEach(z=>{
  roda(-3.5,z);
  roda(-2.5,z);
  roda(1.6,z);
  roda(3.5,z);
});

// Escapamentos e espelhos
caixa(truck,0.18,1.5,0.18,1.8,2.6,-1.18,0x333b43,0.7);
caixa(truck,0.15,0.65,0.15,3.0,2.4,1.22,0x333b43);
caixa(truck,0.15,0.65,0.15,3.0,2.4,-1.22,0x333b43);

// Nome na carreta sem AB
const detalhe = caixa(truck,0.03,0.12,1.2,-4.43,2.2,0,0x66717b);

// Centraliza o caminhão
truck.position.y = 0.2;
truck.scale.set(1.0,1.0,1.0);

// Rotação lenta
function animar() {
  requestAnimationFrame(animar);
  truck.rotation.y += 0.0015;
  renderer.render(scene,camera);
}
animar();

window.addEventListener('resize',()=>{
  camera.aspect = area.clientWidth / area.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(area.clientWidth,area.clientHeight);
});
</script>
</body>
</html>
